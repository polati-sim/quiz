<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Игра-тренажёр — Полати</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#EC5A24;--orange-d:#C9440F;
  --ink:#1E2528;--ink2:#2E393D;
  --teal:#17705E;--teal-d:#0F5446;--mint:#E3F5EE;
  --red:#E24B4A;
  --paper:#F4F5F2;--card:#fff;--line:#E1E5E0;--muted:#66717A;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
button{font:inherit;color:inherit;cursor:pointer}

.top{flex:none;padding:14px 16px 10px;display:flex;align-items:center;gap:12px}
.top b{font-size:15px;font-weight:800}
.prog{flex:1;height:8px;border-radius:99px;background:#E4E7E2;overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .25s}
.score{flex:none;font-weight:800;font-size:14px;background:var(--ink);color:#fff;border-radius:999px;padding:5px 12px;min-width:44px;text-align:center}

.stage{flex:1;position:relative;padding:6px 18px 4px;display:flex;align-items:center;justify-content:center;min-height:0}
.deck{position:relative;width:100%;max-width:400px;height:min(68vh,540px)}
.card{position:absolute;inset:0;background:var(--card);border-radius:22px;border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(30,37,40,.10);display:flex;flex-direction:column;overflow:hidden;
  touch-action:pan-y;will-change:transform;transition:transform .28s cubic-bezier(.2,.7,.3,1),opacity .28s}
.card .media{flex:none;height:38%;min-height:120px;background:#F7F8F6;display:flex;align-items:center;justify-content:center;padding:10px}
.card .media img{max-width:100%;max-height:100%;object-fit:contain}
.card .media.empty{background:linear-gradient(135deg,var(--mint),#fff)}
.card .tag{position:absolute;top:12px;left:12px;background:rgba(30,37,40,.82);color:#fff;
  font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px}
.card .q{flex:1;margin:14px 18px 6px;font-size:17px;font-weight:700;line-height:1.35;display:flex;align-items:center;min-height:0}
.card .opts{flex:none;display:flex;gap:8px;margin:0 18px 16px}
.card .opt{flex:1;border-radius:12px;padding:10px 10px;font-size:13px;font-weight:700;text-align:center;line-height:1.25;
  background:#F1F2EF;color:var(--ink2);border:1.5px solid var(--line)}
.stamp{position:absolute;top:22px;font-weight:800;font-size:13px;letter-spacing:.04em;padding:6px 12px;
  border-radius:10px;border:3px solid var(--ink);color:var(--ink);transform:rotate(-10deg);opacity:0;transition:opacity .1s;max-width:46%;text-align:center}
.stamp.l{left:16px}
.stamp.r{right:16px;transform:rotate(10deg)}

.fb{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;text-align:center;padding:26px;color:#fff;opacity:0;pointer-events:none;
  transition:opacity .18s}
.fb.show{opacity:1;pointer-events:auto}
.fb.ok{background:var(--teal-d)}
.fb.bad{background:var(--red)}
.fb svg{width:42px;height:42px}
.fb b{font-size:18px;font-weight:800}
.fb p{margin:0;font-size:14px;line-height:1.45;max-width:280px;opacity:.96}
.fb button{margin-top:6px;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:10px 22px;font-weight:800;font-size:14px}

.ctrl{flex:none;display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 16px calc(14px + var(--safe-b))}
.rbtn{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
  box-shadow:0 3px 10px rgba(30,37,40,.08);display:flex;align-items:center;justify-content:center}
.rbtn svg{width:24px;height:24px;stroke:var(--ink)}
.rbtn:active{transform:scale(.94)}
.ctrl .hint2{font-size:12px;color:var(--muted);text-align:center;max-width:120px;font-weight:700}

.result{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:6px;overflow:auto}
.result .ring{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--teal) calc(var(--pct)*1%),#E4E7E2 0);margin-bottom:6px;flex:none}
.result .ring i{width:112px;height:112px;border-radius:50%;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-style:normal}
.result .ring b{font-size:28px;font-weight:800}
.result .ring span{font-size:12px;color:var(--muted);font-weight:700}
.result h2{margin:4px 0 0;font-size:20px}
.result p{margin:2px 0 16px;color:var(--muted);font-size:14px}
.result .list{width:100%;max-width:380px;text-align:left;margin-bottom:18px;border-top:1px solid var(--line)}
.result .row{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px}
.result .row svg{flex:none;width:18px;height:18px;margin-top:1px}
.result .row.ok svg{stroke:var(--teal)}
.result .row.bad svg{stroke:var(--red)}
.actions{display:flex;gap:10px;width:100%;max-width:380px;flex:none}
.btn{flex:1;height:48px;border-radius:12px;border:1.5px solid var(--ink);background:#fff;font-weight:800;font-size:14px}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#15191A;--card:#1E2528;--ink:#F2F3F1;--ink2:#D6DAD7;--muted:#93A099;--line:#333B3C}
}
:root[data-theme="dark"]{--paper:#15191A;--card:#1E2528;--ink:#F2F3F1;--ink2:#D6DAD7;--muted:#93A099;--line:#333B3C}
</style>
</head>
<body>

<div class="top" id="topBar">
  <b>Тренажёр СКД</b>
  <div class="prog"><i id="progBar"></i></div>
  <div class="score" id="scoreTag">0/0</div>
</div>

<div class="stage" id="stage">
  <div class="deck" id="deck"></div>
</div>

<div class="ctrl" id="ctrl">
  <button class="rbtn" id="btnNo" aria-label="Левый вариант"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <div class="hint2">Свайп карточки или кнопки — выбор варианта</div>
  <button class="rbtn" id="btnYes" aria-label="Правый вариант"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg></button>
</div>

<div class="result" id="result"></div>

<script>
/* ======= банк вопросов =======
   img     — ключ картинки из IMG ниже, или '' если без картинки
   tag     — тема (пока не используется для фильтра, но пригодится позже)
   q       — текст вопроса
   left / right — текст двух вариантов ответа, как они заданы автором
   correct — 'left' или 'right' — какой из вариантов (по смыслу, не по стороне экрана) верный
   why     — {left:'...', right:'...'} — пояснение, которое показывается, если человек выбрал соответствующий вариант
   На экране лево/право для каждой карточки перемешивается случайно, чтобы нельзя было угадать по стороне.
*/
var DECK = [
  {
    tag:'Снаряжение', img:'IMG_CARABINER',
    q:'К какому классу относится этот карабин?',
    left:'Класс B', right:'Класс A',
    correct:'right',
    why:{
      right:'Верно. Класс A — карабины, выполняющие функцию анкерного устройства, их можно крепить прямо к опоре.',
      left:'Неверно. Класс B — это соединительный элемент для присоединения к анкерному устройству или силовому кольцу привязи и для соединения компонентов системы, а не сам анкер.'
    }
  },
  {
    tag:'Работы на высоте', img:'IMG_HEIGHT',
    q:'Является ли это работой на высоте?',
    left:'Точно нет', right:'Точно да',
    correct:'right',
    why:{
      right:'Верно. Высота более 1,8 м — это уже работа на высоте, но с ограждением от 1,1 м она считается безопасной.',
      left:'Неверно. Высота здесь больше 1,8 м, а значит это работа на высоте — просто безопасная благодаря ограждению.'
    }
  },
  {
    tag:'Оборудование', img:'IMG_PLATFORM',
    q:'Является ли это средством подмащивания?',
    left:'Нет', right:'Да',
    correct:'right',
    why:{
      right:'Верно. Это люлька — она помогает организовать работу на высоте, поэтому относится к средствам подмащивания.',
      left:'Неверно. Это люлька, а она как раз помогает организовать работу на высоте, значит это средство подмащивания.'
    }
  },
  {
    tag:'Снаряжение', img:'IMG_ROPE',
    q:'Какая верёвка по типу растяжения показана на схеме?',
    left:'Динамический канат', right:'Статический канат',
    correct:'right',
    why:{
      right:'Верно. Статический канат тянется слабо (обычно до 10%), поэтому его используют для навесок, подъёма и спуска.',
      left:'Неверно. Динамический канат растягивается намного сильнее (до 30%) и гасит рывок при срыве — его берут для лазания, не для навесок.'
    }
  },
  {
    tag:'Погодные условия', img:'',
    q:'При какой скорости ветра можно работать на высоте в открытых местах?',
    left:'Более 15 м/с', right:'До 15 м/с',
    correct:'right',
    why:{
      right:'Верно. При скорости ветра до 15 м/с работать в открытых местах на высоте можно.',
      left:'Неверно. При скорости ветра от 15 м/с и выше работы на высоте в открытых местах останавливают.'
    }
  }
];
/* ================================================ */

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function $(id){return document.getElementById(id);}

var order=[], idx=0, correct=0, history=[];

function start(){
  order=shuffle(DECK.map(function(_,i){return i;}));
  idx=0;correct=0;history=[];
  $('deck').innerHTML='';
  $('result').style.display='none';
  $('topBar').style.display='flex';$('stage').style.display='flex';$('ctrl').style.display='flex';
  renderProgress();
  buildCard(0);
  buildCard(1);
}
function renderProgress(){
  $('progBar').style.width=(order.length?idx/order.length*100:0)+'%';
  $('scoreTag').textContent=correct+'/'+order.length;
}
function cardHTML(q,leftText,rightText){
  var img=q.img?IMG[q.img]:'';
  var media=img?'<div class="media"><img src="'+img+'" alt=""></div>':'<div class="media empty"></div>';
  return media+'<div class="tag">'+q.tag+'</div>'+
    '<div class="q">'+q.q+'</div>'+
    '<div class="opts">'+
      '<div class="opt">'+leftText+'</div>'+
      '<div class="opt">'+rightText+'</div>'+
    '</div>'+
    '<div class="stamp l">'+leftText+'</div><div class="stamp r">'+rightText+'</div>'+
    '<div class="fb ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg><b>Верно</b><p></p><button type="button">Дальше</button></div>'+
    '<div class="fb bad"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg><b>Неверно</b><p></p><button type="button">Дальше</button></div>';
}
function buildCard(pos){
  var oi=order[idx+pos];if(oi===undefined)return;
  var q=DECK[oi],el=document.createElement('div');
  el.className='card';el.style.zIndex=String(10-pos);
  el.style.transform='translateY('+(pos*10)+'px) scale('+(1-pos*0.035)+')';
  el.style.opacity=pos>1?'0':'1';
  /* лево/право на экране перемешивается случайно, чтобы сторона не подсказывала ответ */
  var flip=Math.random()<0.5;
  var leftText=flip?q.right:q.left, rightText=flip?q.left:q.right;
  var corrSide=(q.correct==='left')?(flip?'right':'left'):(flip?'left':'right');
  el.innerHTML=cardHTML(q,leftText,rightText);
  el.dataset.pos=pos;el.dataset.oi=oi;el.dataset.corr=corrSide;
  $('deck').appendChild(el);
  if(pos===0){attachSwipe(el);el._swipeBound=true;}
  el.querySelectorAll('.fb button').forEach(function(b){b.addEventListener('click',advance);});
}
function topCard(){return $('deck').querySelector('.card[data-pos="0"]');}

function attachSwipe(el){
  var sx=0,sy=0,dx=0,dragOn=false,w=el.parentElement.clientWidth||320;
  function down(x,y){dragOn=true;sx=x;sy=y;dx=0;el.style.transition='none';}
  function move(x,y){
    if(!dragOn)return;dx=x-sx;var dy=y-sy;if(Math.abs(dy)>Math.abs(dx)*1.3)return;
    var rot=dx/22;
    el.style.transform='translate('+dx+'px,'+(dy*0.15)+'px) rotate('+rot+'deg)';
    var t=Math.min(Math.abs(dx)/70,1);
    el.querySelector('.stamp.l').style.opacity=dx<0?t:0;
    el.querySelector('.stamp.r').style.opacity=dx>0?t:0;
  }
  function up(){
    if(!dragOn)return;dragOn=false;el.style.transition='';
    if(Math.abs(dx)>w*0.26){judge(dx>0?'right':'left');}
    else{el.style.transform='';el.querySelector('.stamp.l').style.opacity=0;el.querySelector('.stamp.r').style.opacity=0;}
  }
  el.addEventListener('touchstart',function(e){down(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  el.addEventListener('touchmove',function(e){move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  el.addEventListener('touchend',up);
  el.addEventListener('mousedown',function(e){down(e.clientX,e.clientY);
    function mm(e){move(e.clientX,e.clientY);}
    function mu(){up();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);}
    window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
  });
}
function judge(side){
  var el=topCard();if(!el||el.dataset.judged)return;el.dataset.judged='1';
  var oi=+el.dataset.oi,q=DECK[oi],corr=el.dataset.corr,ok=(side===corr);
  var pickedText=el.querySelectorAll('.opt')[side==='left'?0:1].textContent;
  if(ok)correct++;
  history.push({q:q,ok:ok,pickedText:pickedText});
  var toRight=(side==='right');
  el.style.transform='translate('+(toRight?1:-1)*480+'px,-30px) rotate('+(toRight?24:-24)+'deg)';
  el.style.opacity='0';
  var fb=el.querySelector(ok?'.fb.ok':'.fb.bad');
  fb.querySelector('p').textContent=q.why[q.correct]||'';
  setTimeout(function(){fb.classList.add('show');},180);
}
$('btnYes').addEventListener('click',function(){judge('right');});
$('btnNo').addEventListener('click',function(){judge('left');});

function advance(){
  var el=topCard();if(el)el.remove();
  idx++;
  renderProgress();
  var cards=$('deck').querySelectorAll('.card');
  cards.forEach(function(c,i){
    c.dataset.pos=i;c.style.zIndex=String(10-i);
    c.style.transform='translateY('+(i*10)+'px) scale('+(1-i*0.035)+')';
    c.style.opacity='1';
    if(i===0 && !c._swipeBound){attachSwipe(c);c._swipeBound=true;}
  });
  if(idx>=order.length){finish();return;}
  if(order[idx+1]!==undefined && $('deck').children.length<2)buildCard(1);
}

function finish(){
  $('topBar').style.display='none';$('stage').style.display='none';$('ctrl').style.display='none';
  var pct=order.length?Math.round(correct/order.length*100):0;
  var r=$('result');r.style.display='flex';r.style.setProperty('--pct',pct);
  var msg=pct>=90?'Отличный результат':pct>=70?'Хороший результат':'Есть куда расти';
  var rows=history.map(function(h){
    return '<div class="row '+(h.ok?'ok':'bad')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+
      (h.ok?'<path d="M5 13l4 4L19 7"/>':'<path d="M18 6 6 18M6 6l12 12"/>')+'</svg><span><b>'+h.q.q+'</b><br>Ваш ответ: '+h.pickedText+'</span></div>';
  }).join('');
  r.innerHTML='<div class="ring"><i><b>'+correct+'/'+order.length+'</b><span>'+pct+'%</span></i></div>'+
    '<h2>'+msg+'</h2><p>Разбор ответов — ниже</p>'+
    '<div class="list">'+rows+'</div>'+
    '<div class="actions"><button class="btn pri" id="againBtn" style="flex:1">Пройти ещё раз</button></div>';
  $('againBtn').addEventListener('click',start);
}
start();
</script>
</body>
</html>
